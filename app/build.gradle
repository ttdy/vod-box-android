apply plugin: 'com.android.application'

android {
    namespace 'com.vodbox.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.vodbox.app"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1"
        externalNativeBuild {
            cmake {
                cppFlags ""
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }
    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a"
            universalApk false
        }
    }
    signingConfigs {
        release {
            def ksFile = System.getenv('VODBOX_KEYSTORE_FILE')
            if (ksFile != null && file(ksFile).exists()) {
                storeFile file(ksFile)
                storePassword System.getenv('VODBOX_KEYSTORE_PASS')
                keyAlias 'vodbox'
                keyPassword System.getenv('VODBOX_KEYSTORE_PASS')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig (System.getenv('VODBOX_KEYSTORE_FILE') != null
                    && file(System.getenv('VODBOX_KEYSTORE_FILE')).exists())
                    ? signingConfigs.release : signingConfigs.debug
        }
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs 'libnode/bin/'
        }
    }
}
