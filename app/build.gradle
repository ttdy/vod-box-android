apply plugin: 'com.android.application'

def ksFile = System.getenv('VODBOX_KEYSTORE_FILE')
def hasKs = ksFile != null && file(ksFile).exists()

android {
    namespace 'com.vodbox.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.vodbox.app"
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName "1.6"
        externalNativeBuild {
            cmake {
                cppFlags ""
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }
    buildFeatures {
        buildConfig true
    }
    flavorDimensions "entry"
    productFlavors {
        // 主版本：界面保留「高级」按钮进入高级功能
        button {
            dimension "entry"
            buildConfigField "String", "UPDATE_JSON_URL", '"https://ttdy.github.io/update.json"'
        }
        // 连点版：隐藏按钮，连续点击左上角「聚合影院」3 次后输入密码进入
        // 名称用 tapin，避免与 Groovy GDK 的 Object.tap() 方法冲突
        tapin {
            dimension "entry"
            applicationIdSuffix ".tap"
            buildConfigField "String", "UPDATE_JSON_URL", '"https://ttdy.github.io/update-tap.json"'
        }
    }
    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a"
            universalApk false
        }
    }
    signingConfigs {
        release {
            if (hasKs) {
                storeFile file(ksFile)
                storePassword System.getenv('VODBOX_KEYSTORE_PASS')
                keyAlias 'vodbox'
                keyPassword System.getenv('VODBOX_KEYSTORE_PASS')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (hasKs) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs 'libnode/bin/'
        }
    }
}

// 主版本（button）产物沿用历史文件名 app-<abi>-release.apk，保证老版本 App 的升级地址不变；
// 连点版（tapin）对外统一为 app-tap-<abi>-release.apk。
android.applicationVariants.all { variant ->
    variant.outputs.all { output ->
        def fn = output.outputFileName
        if (fn.startsWith('app-button-')) {
            output.outputFileName = fn.replace('app-button-', 'app-')
        } else if (fn.startsWith('app-tapin-')) {
            output.outputFileName = fn.replace('app-tapin-', 'app-tap-')
        }
    }
}
